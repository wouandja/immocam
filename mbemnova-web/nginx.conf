# =============================================================================
# ImmoCam — Config Nginx Frontend (dans le conteneur)
# Sert l'Angular SPA + proxifie /api vers le backend
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        application/x-javascript text/xml application/xml
        application/xml+rss text/javascript image/svg+xml
        application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # ── Logo — revalidation ETag (pas de cache long : le logo peut changer) ──
    location = /logo.jpeg {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
        access_log off;
        try_files $uri =404;
    }

    # ── Assets buildés par Angular (noms hashés → immutable safe) ────────────
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Images génériques (courte durée, avec ETag) ───────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        etag on;
        access_log off;
        try_files $uri =404;
    }

    # ── Sitemap dynamique (généré par le backend avec les annonces actives) ──
    location = /sitemap.xml {
        proxy_pass http://immocam_api:1010/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    # ── Proxy vers API backend ────────────────────────────────────────────────
    # Le frontend appelle /api/* → redirigé vers le conteneur backend
    location /api/ {
        proxy_pass http://immocam_api:1010/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ── SPA routing (Angular Router) ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/immocam_access.log;
    error_log  /var/log/nginx/immocam_error.log warn;
}
