# =============================================================================
# Bailocam — Docker Compose PRODUCTION
#
# Domaine : https://bailocam.com
# Architecture :
#   Nginx (host, 80/443) ──→ frontend:4200 (localhost only)
#                       └──→ /api → api:1010 (localhost only)
#   postgres → accès interne uniquement (127.0.0.1:5433)
#
# Le reverse proxy Nginx est installé sur le HOST (pas dans Docker).
# Voir /etc/nginx/sites-available/bailocam pour la config host.
#
# Secrets : /opt/bailocam/.env.prod  (jamais commité sur Git)
# Deploy  : GitHub Actions → ssh → docker compose up -d
# =============================================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: immocam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-immocam_db}
      POSTGRES_USER: ${DB_USERNAME:-immocam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Douala
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - immocam_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-immocam_user} -d ${DB_NAME:-immocam_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c log_min_duration_statement=1000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/immocam-api:${IMAGE_TAG:-latest}
    container_name: immocam_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-immocam_db}
      DB_USERNAME: ${DB_USERNAME:-immocam_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bailocam}
      UPLOAD_DIR: /app/uploads/annonces
      UPLOAD_TEMP_DIR: /app/uploads/temp
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-https://bailocam.com/uploads/}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
      APP_TEST_DATA_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: Africa/Douala
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    ports:
      - "127.0.0.1:1010:1010"
    networks:
      - immocam_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1010/api/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend Angular ────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/immocam-frontend:${IMAGE_TAG:-latest}
    container_name: immocam_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:4200:80"
    networks:
      - immocam_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Volumes persistants ───────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    name: immocam_postgres_data
  uploads_data:
    driver: local
    name: immocam_uploads_data
  api_logs:
    driver: local
    name: immocam_api_logs

# ── Réseaux isolés ────────────────────────────────────────────────────────────
networks:
  immocam_backend:
    driver: bridge
    name: immocam_backend_net
