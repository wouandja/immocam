spring:
  datasource:
    url: jdbc:h2:mem:immocam_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: simple
immocam:
  storage:
    upload-dir: ./target/test-uploads
    compression:
      enabled: false
  security:
    jwt:
      secret: test-secret-key-minimum-32-chars
  scheduler:
    enabled: false
server:
  port: 0
