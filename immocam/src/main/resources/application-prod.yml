# =============================================================================
# Bailocam — Configuration PRODUCTION
# Les valeurs sensibles sont injectées via variables d'environnement
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false 

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    cache: true

server:
  error:
    include-message: never
    include-stacktrace: never

# Swagger désactivé en prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

immocam:
  email:
    from: ${EMAIL_FROM:noreply@bailocam.cm}
    from-name: ${EMAIL_FROM_NAME:Bailocam}
  storage:
    upload-dir: ${UPLOAD_DIR:/app/uploads/annonces}
    temp-dir: ${UPLOAD_TEMP_DIR:/app/uploads/temp}
    base-url: ${STORAGE_BASE_URL}
  security:
    jwt:
      secret: ${JWT_SECRET}
  scheduler:
    enabled: true

logging:
  level:
    root: WARN
    com.mbem.immocam: INFO
  file:
    name: /app/logs/immocam.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
