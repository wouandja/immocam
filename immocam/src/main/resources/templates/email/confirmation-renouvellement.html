<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head><meta charset="UTF-8"><title>Annonce renouvelée — Bailocam</title></head>
<body style="font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px;">
<div style="max-width:500px;margin:0 auto;background:#fff;border-radius:8px;padding:32px;">
  <h2 style="color:#1a56db;">Bailocam</h2>
  <p>Bonjour <strong th:text="${prenom}">Prénom</strong>,</p>
  <p>Votre annonce <strong><span th:text="${typeBien}">Appartement</span>
     à <span th:text="${ville}">Douala</span></strong>
     a été renouvelée avec succès.</p>
  <div style="background:#f0fdf4;border-left:4px solid #16a34a;padding:12px 16px;margin:20px 0;">
    Elle reste désormais visible jusqu'au
    <strong th:text="${nouvelleDateExpiration}">05/06/2026</strong>.
  </div>
  <p style="color:#888;font-size:12px;margin-top:24px;">
    Vous recevrez un rappel par email 5 jours puis 1 jour avant la nouvelle expiration.
  </p>
</div>
</body>
</html>
