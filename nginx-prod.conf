# =============================================================================
# Bailocam — Config Nginx Reverse Proxy (HOST)
#
# Domaine  : bailocam.com + www.bailocam.com
# SSL      : Let's Encrypt (Certbot)
# Architecture :
#   Nginx (host, 80/443) ──→ 127.0.0.1:4200 (frontend Docker)
#                       └──→ 127.0.0.1:1010 (api Docker)
#
# Installation :
#   sudo cp nginx-prod.conf /etc/nginx/sites-available/bailocam
#   sudo ln -s /etc/nginx/sites-available/bailocam /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name bailocam.com www.bailocam.com;

    # Challenge Let's Encrypt (renouvellement auto)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl;
    http2 on;
    server_name bailocam.com www.bailocam.com;

    ssl_certificate     /etc/letsencrypt/live/bailocam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bailocam.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # API backend (Spring Boot dans Docker → port 1010 localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:1010/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Uploads (fichiers statiques servis par le backend)
    location /uploads/ {
        proxy_pass http://127.0.0.1:1010/api/uploads/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Angular (dans Docker → port 4200 localhost)
    location / {
        proxy_pass http://127.0.0.1:4200/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support du routing Angular (SPA)
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://127.0.0.1:4200/index.html;
        proxy_set_header Host $host;
    }
}
